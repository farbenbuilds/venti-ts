name: Autobahn

on:
  push:
    branches:
      - main
    paths:
      - "**.zig"
      - "src/**"
      - "tests/autobahn/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/autobahn.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.zig"
      - "src/**"
      - "tests/autobahn/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/autobahn.yml"
  schedule:
    # Weekly, off the hour, so the RFC 6455 report is refreshed even when no
    # pull request touches the engine.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autobahn-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzzing-client:
    name: RFC 6455 conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: Autobahn
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@24
          cache: true
          install: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore Zig caches
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-pkg
          key: zig-0.16.0-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/builds/**') }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-${{ github.repository }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the native addon
        run: pnpm build:binding

      - name: Pull the digest-pinned fuzzing client
        # Pulled before the gate so an unpullable reference fails here with a
        # clear message rather than surfacing as a protocol failure.
        run: docker pull crossbario/autobahn-testsuite@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074

      - name: Run the suite
        # The harness writes its report and a JSON summary on every exit path,
        # so the artifacts below exist even when the gate fails.
        run: pnpm run test:autobahn

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-report
          path: tests/autobahn/reports
          if-no-files-found: warn
          retention-days: 30
