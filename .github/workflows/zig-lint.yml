name: Zig Lint

on:
  push:
    branches:
      - main
    paths:
      - "**.zig"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/zig-lint.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.zig"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/zig-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zig-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zig:
    name: Zig formatting
    runs-on: ubuntu-24.04
    environment:
      name: Zig Lint
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check --exclude zig-pkg src build.zig
