name: Nix Lint

on:
  push:
    branches:
      - main
    paths:
      - "**/*.nix"
      - "flake.lock"
      - ".github/workflows/nix-lint.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.nix"
      - "flake.lock"
      - ".github/workflows/nix-lint.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: nix-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix:
    name: Nix formatting
    runs-on: ubuntu-24.04
    environment:
      name: Nix Lint
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - name: Check formatting
        run: nix fmt -- --check $(git ls-files '*.nix' | grep -v '\.zon\.nix$')
