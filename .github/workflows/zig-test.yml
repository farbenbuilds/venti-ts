name: Zig Test

on:
  push:
    branches:
      - main
    paths:
      - "**.zig"
      - "build.zig"
      - "build.zig.zon"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "tsconfig.dist-types.json"
      - "tsdown.config.ts"
      - ".github/workflows/zig-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.zig"
      - "build.zig"
      - "build.zig.zon"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "tsconfig.dist-types.json"
      - "tsdown.config.ts"
      - ".github/workflows/zig-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zig-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Zig unit tests
    runs-on: ubuntu-24.04
    environment:
      name: Zig Test
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore Zig caches
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-pkg
          key: zig-0.16.0-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('build.zig', 'build.zig.zon', 'scripts/zig-cc-pic', 'scripts/zig-cxx-pic') }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-${{ github.repository }}-

      - name: Install vendor build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build perl patch zlib1g-dev
          mkdir -p .ci-zlib/include .ci-zlib/lib
          ln -sf /usr/include/zlib.h .ci-zlib/include/zlib.h
          ln -sf /usr/include/zconf.h .ci-zlib/include/zconf.h
          libz="$(dpkg -L zlib1g-dev | grep '/libz\.a$' | head -n 1)"
          if [ -z "$libz" ]; then
            echo "zlib static library not found" >&2
            exit 1
          fi
          ln -sf "$libz" .ci-zlib/lib/libz.a
          printf 'UWEBZOCKETS_ZLIB_PREFIX=%s/.ci-zlib\n' "$PWD" >> "$GITHUB_ENV"

      - name: Run Zig unit tests
        run: zig build test --summary all

  binding:
    name: Binding lifecycle tests
    runs-on: ubuntu-24.04
    environment:
      name: Binding Test
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@24
          cache: true
          install: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore Zig caches
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-pkg
          key: zig-0.16.0-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('build.zig', 'build.zig.zon', 'scripts/zig-cc-pic', 'scripts/zig-cxx-pic') }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-${{ github.repository }}-

      - name: Install vendor build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build perl patch
          # The shared addon links a static zlib; the distro's libz.a is not
          # position independent, so build the pinned release with -fPIC.
          curl -fsSL -o /tmp/zlib.tar.gz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          echo "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23  /tmp/zlib.tar.gz" | sha256sum -c -
          tar -xzf /tmp/zlib.tar.gz -C /tmp
          cd /tmp/zlib-1.3.1
          CFLAGS="-fPIC" ./configure --static --prefix="$GITHUB_WORKSPACE/.ci-zlib"
          make -j"$(nproc)"
          make install
          printf 'UWEBZOCKETS_ZLIB_PREFIX=%s/.ci-zlib\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the native addon
        run: pnpm build:binding

      - name: Check the built declarations
        run: pnpm exec tsdown && pnpm run typecheck:dist

      - name: Run binding lifecycle tests
        run: pnpm exec vitest run tests/binding tests/compat/socket tests/compat/stream.test.ts tests/conformance
