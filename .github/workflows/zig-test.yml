name: Zig Test

on:
  push:
    branches:
      - main
    paths:
      - "**.zig"
      - "build.zig"
      - "build.zig.zon"
      - "scripts/**"
      - "src/binding/**"
      - "tests/binding/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/zig-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.zig"
      - "build.zig"
      - "build.zig.zon"
      - "scripts/**"
      - "src/binding/**"
      - "tests/binding/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/zig-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: zig-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Zig unit tests
    runs-on: ubuntu-24.04
    environment:
      name: Zig Test
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Restore Zig caches
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-pkg
          key: zig-0.16.0-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'scripts/zig-cc-pic', 'scripts/zig-cxx-pic') }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-

      - name: Install vendor build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build perl patch zlib1g-dev
          mkdir -p .ci-zlib/include .ci-zlib/lib
          ln -sf /usr/include/zlib.h .ci-zlib/include/zlib.h
          ln -sf /usr/include/zconf.h .ci-zlib/include/zconf.h
          libz="$(dpkg -L zlib1g-dev | grep '/libz\.a$' | head -n 1)"
          if [ -z "$libz" ]; then
            echo "zlib static library not found" >&2
            exit 1
          fi
          ln -sf "$libz" .ci-zlib/lib/libz.a
          printf 'UWEBZOCKETS_ZLIB_PREFIX=%s/.ci-zlib\n' "$PWD" >> "$GITHUB_ENV"

      - name: Run Zig unit tests
        run: zig build test --summary all

  binding:
    name: Binding lifecycle tests
    runs-on: ubuntu-24.04
    environment:
      name: Binding Test
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@24
          cache: true
          install: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Restore Zig caches
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-pkg
          key: zig-0.16.0-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'scripts/zig-cc-pic', 'scripts/zig-cxx-pic') }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-

      - name: Install vendor build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build perl patch zlib1g-dev
          mkdir -p .ci-zlib/include .ci-zlib/lib
          ln -sf /usr/include/zlib.h .ci-zlib/include/zlib.h
          ln -sf /usr/include/zconf.h .ci-zlib/include/zconf.h
          libz="$(dpkg -L zlib1g-dev | grep '/libz\.a$' | head -n 1)"
          if [ -z "$libz" ]; then
            echo "zlib static library not found" >&2
            exit 1
          fi
          ln -sf "$libz" .ci-zlib/lib/libz.a
          printf 'UWEBZOCKETS_ZLIB_PREFIX=%s/.ci-zlib\n' "$PWD" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the native addon
        run: pnpm build:binding

      - name: Run binding lifecycle tests
        run: pnpm exec vitest run tests/binding.test.ts tests/binding
